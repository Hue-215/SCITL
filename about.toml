# cargo-aboutの設定。配布物に同梱する第三者ライセンスの一覧(Rustのクレート)を作る
# (`scripts/assemble-dist.mjs`)。方針は docs/spec/architecture/tech-stack.md「ライセンス」。

# 許容するライセンス。ここに無いライセンスの依存があると、生成が失敗する。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
]

# 配布する対象。ここに無いOS向けにしかビルドされないクレートは、一覧に入れない。
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# 実行ファイルに入らないもの(ビルドスクリプト・手続きマクロ・テスト用)は一覧に入れない。
ignore-build-dependencies = true
ignore-dev-dependencies = true
