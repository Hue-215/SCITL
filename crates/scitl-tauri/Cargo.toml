[package]
name = "scitl-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
scitl-core = { path = "../scitl-core" }
tauri = "2"
secrecy = { workspace = true }
percent-encoding = { workspace = true }
tauri-plugin-single-instance = "2.4"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.9"

[dev-dependencies]
serde_json = { workspace = true }

[features]
# このフィーチャの有無が、Tauriが `devUrl`(Vite開発サーバー)と埋め込み済みの
# フロントエンドのどちらを読むかを決める(ビルドプロファイルではない)。
# 無効のままだと本番ビルドでも devUrl を読みに行き、開発サーバーが無い環境で
# 起動できない。tauri-cliは本番ビルド時にこれを有効にする。
custom-protocol = ["tauri/custom-protocol"]
