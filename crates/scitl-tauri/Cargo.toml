[package]
name = "scitl-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

# 本体はライブラリに置き、デスクトップの実行ファイル(`main.rs`)とAndroidのActivityの両方から
# 呼ぶ(`lib.rs`の`run`)。Androidは`cdylib`(共有ライブラリ)を読み込む。名前を実行ファイルと
# 変えるのは、Windowsで両者のデバッグ情報(.pdb)の名前がぶつかるため
# (https://github.com/rust-lang/cargo/issues/8519)。iOSは対象にしないので`staticlib`は足さない
[lib]
name = "scitl_tauri_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scitl-core = { path = "../scitl-core" }
tauri = { version = "2", features = [] }
secrecy = { workspace = true }
tauri-plugin-dialog = "2"

# 多重起動の防止とクリップボードの画像の読み出しはデスクトップだけ(`lib.rs`の`run`。
# clipboard-managerのAndroid側は文字しか読めない)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"
tauri-plugin-clipboard-manager = "~2.3"

# 選択画面で選んだ`content://`のURIを開く(Androidだけ。デスクトップはパスで届く)
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.9"

[dev-dependencies]
serde_json = { workspace = true }

[features]
# このフィーチャの有無が、Tauriが `devUrl`(Vite開発サーバー)と埋め込み済みの
# フロントエンドのどちらを読むかを決める(ビルドプロファイルではない)。
# 無効のままだと本番ビルドでも devUrl を読みに行き、開発サーバーが無い環境で
# 起動できない。tauri-cliは本番ビルド時にこれを有効にする。
custom-protocol = ["tauri/custom-protocol"]
